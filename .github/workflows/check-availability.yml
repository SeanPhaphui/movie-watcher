name: Check streaming availability

on:
  schedule:
    - cron: '0 5,11,17,23 * * *' # 4x daily (UTC)
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/check-availability.mjs
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
